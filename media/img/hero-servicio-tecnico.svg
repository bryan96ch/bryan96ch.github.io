<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" role="img" aria-hidden="true">
  <defs>
    <filter id="st-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00478f" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="st-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2fb"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect x="10" y="10" width="340" height="320" rx="28" fill="url(#st-bg)"/>

  <!-- El celular del tecnico -->
  <rect x="40" y="40" width="132" height="262" rx="20" fill="#ffffff" stroke="#00478f" stroke-width="3"/>
  <rect x="88" y="50" width="36" height="6" rx="3" fill="#00478f"/>
  <rect x="54" y="68" width="104" height="30" rx="8" fill="#00478f"/>
  <rect x="64" y="77" width="52" height="6" rx="3" fill="#ffffff"/>
  <rect x="64" y="87" width="34" height="5" rx="2.5" fill="#ffffff" opacity="0.7"/>

  <!-- Lo que se hizo -->
  <circle cx="64" cy="116" r="8" fill="#e9f5ec"/>
  <path d="M60 116 l3 3 l5.5 -6" stroke="#3d8f52" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="80" y="113" width="70" height="6" rx="3" fill="#5a6b80"/>
  <circle cx="64" cy="140" r="8" fill="#e9f5ec"/>
  <path d="M60 140 l3 3 l5.5 -6" stroke="#3d8f52" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="80" y="137" width="56" height="6" rx="3" fill="#5a6b80"/>
  <circle cx="64" cy="164" r="8" fill="#fdf0e6"/>
  <rect x="61" y="161" width="6" height="6" rx="1.5" fill="#c2601f"/>
  <rect x="80" y="161" width="62" height="6" rx="3" fill="#5a6b80" opacity="0.75"/>

  <!-- Las fotos -->
  <rect x="54" y="184" width="48" height="36" rx="6" fill="#e6f0f8"/>
  <path d="M58 214 l12 -13 l9 9 l6 -6 l13 10" stroke="#0e72c5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="108" y="184" width="48" height="36" rx="6" fill="#e6f0f8"/>
  <circle cx="132" cy="202" r="9" fill="none" stroke="#0e72c5" stroke-width="2.4"/>

  <!-- La firma del cliente -->
  <path d="M60 262 c8 -16 14 6 22 -4 s12 -12 18 0 s10 4 16 -3 s8 -2 12 2" stroke="#1c2b3f" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M56 274 h100" stroke="#e6f0f8" stroke-width="2"/>

  <!-- Conector hacia la orden -->
  <path d="M178 120 L204 120" stroke="#00478f" stroke-width="1.8" stroke-dasharray="3 4" opacity="0.6" fill="none"/>

  <!-- Tarjeta: la orden de trabajo, con la llave -->
  <rect x="204" y="64" width="124" height="118" rx="14" fill="#ffffff" stroke="#e6f0f8" stroke-width="1.5" filter="url(#st-ds)"/>
  <g transform="rotate(-40 232 98)">
    <rect x="228" y="96" width="8" height="26" rx="4" fill="#c2601f"/>
    <circle cx="232" cy="90" r="9.5" fill="#c2601f"/>
    <rect x="228.8" y="80" width="6.4" height="10" rx="1.4" fill="#ffffff"/>
  </g>
  <rect x="254" y="86" width="56" height="7" rx="3.5" fill="#1c2b3f"/>
  <rect x="254" y="99" width="38" height="5" rx="2.5" fill="#5a6b80"/>
  <rect x="220" y="130" width="92" height="6" rx="3" fill="#5a6b80" opacity="0.75"/>
  <rect x="220" y="144" width="70" height="6" rx="3" fill="#5a6b80" opacity="0.55"/>
  <rect x="220" y="158" width="82" height="6" rx="3" fill="#5a6b80" opacity="0.4"/>

  <!-- La factura -->
  <rect x="226" y="204" width="86" height="96" rx="10" fill="#ffffff" stroke="#00478f" stroke-width="2.5"/>
  <rect x="238" y="218" width="44" height="6" rx="3" fill="#1c2b3f"/>
  <rect x="238" y="232" width="62" height="5" rx="2.5" fill="#5a6b80" opacity="0.7"/>
  <rect x="238" y="244" width="54" height="5" rx="2.5" fill="#5a6b80" opacity="0.7"/>
  <path d="M236 260 h66" stroke="#e6f0f8" stroke-width="2"/>
  <rect x="262" y="268" width="38" height="8" rx="4" fill="#00478f"/>
  <circle cx="312" cy="208" r="13" fill="#3d8f52"/>
  <path d="M306 208 l4 4 l8 -9" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

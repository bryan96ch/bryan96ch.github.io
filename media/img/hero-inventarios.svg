<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" role="img" aria-hidden="true">
  <defs>
    <filter id="inv-ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00478f" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="inv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2fb"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect x="10" y="10" width="340" height="320" rx="28" fill="url(#inv-bg)"/>

  <!-- Estanteria -->
  <rect x="48" y="56" width="11" height="224" rx="3" fill="#00478f"/>
  <rect x="196" y="56" width="11" height="224" rx="3" fill="#00478f"/>
  <rect x="44" y="128" width="167" height="11" rx="3" fill="#0e72c5"/>
  <rect x="44" y="196" width="167" height="11" rx="3" fill="#0e72c5"/>
  <rect x="44" y="264" width="167" height="11" rx="3" fill="#0e72c5"/>

  <!-- Primer nivel -->
  <rect x="66" y="86" width="44" height="42" rx="2" fill="#ffffff" stroke="#00478f" stroke-width="2.5"/>
  <path d="M88 86 V128" stroke="#00478f" stroke-width="2" opacity="0.35"/>
  <path d="M66 99 H110" stroke="#00478f" stroke-width="2" opacity="0.35"/>
  <rect x="118" y="96" width="38" height="32" rx="2" fill="#e6f0f8" stroke="#00478f" stroke-width="2.5"/>
  <path d="M137 96 V128" stroke="#00478f" stroke-width="2" opacity="0.35"/>
  <rect x="164" y="90" width="28" height="38" rx="2" fill="#c2601f"/>
  <path d="M178 90 V128" stroke="#ffffff" stroke-width="2" opacity="0.55"/>

  <!-- Segundo nivel -->
  <rect x="66" y="158" width="38" height="38" rx="2" fill="#e6f0f8" stroke="#00478f" stroke-width="2.5"/>
  <path d="M85 158 V196" stroke="#00478f" stroke-width="2" opacity="0.35"/>
  <rect x="112" y="150" width="46" height="46" rx="2" fill="#ffffff" stroke="#00478f" stroke-width="2.5"/>
  <path d="M135 150 V196" stroke="#00478f" stroke-width="2" opacity="0.35"/>
  <path d="M112 164 H158" stroke="#00478f" stroke-width="2" opacity="0.35"/>
  <rect x="166" y="164" width="26" height="32" rx="2" fill="#0e72c5"/>

  <!-- Tercer nivel -->
  <rect x="66" y="222" width="50" height="42" rx="2" fill="#ffffff" stroke="#00478f" stroke-width="2.5"/>
  <path d="M91 222 V264" stroke="#00478f" stroke-width="2" opacity="0.35"/>
  <rect x="124" y="230" width="34" height="34" rx="2" fill="#c2601f"/>

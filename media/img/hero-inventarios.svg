  <rect x="166" y="226" width="26" height="38" rx="2" fill="#e6f0f8" stroke="#00478f" stroke-width="2.5"/>

  <!-- Conector hacia el kardex -->
  <path d="M214 133 L236 133" stroke="#00478f" stroke-width="1.8" stroke-dasharray="3 4" opacity="0.6" fill="none"/>

  <!-- Tarjeta: el kardex -->
  <rect x="236" y="80" width="96" height="106" rx="14" fill="#ffffff" stroke="#e6f0f8" stroke-width="1.5" filter="url(#inv-ds)"/>
  <rect x="250" y="96" width="52" height="7" rx="3.5" fill="#1c2b3f"/>
  <path d="M250 126 L255 119 L260 126" stroke="#3d8f52" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="268" y="119" width="48" height="6" rx="3" fill="#5a6b80"/>
  <path d="M250 145 L255 152 L260 145" stroke="#c2601f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="268" y="145" width="38" height="6" rx="3" fill="#5a6b80"/>
  <path d="M250 172 L255 165 L260 172" stroke="#3d8f52" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="268" y="165" width="44" height="6" rx="3" fill="#5a6b80"/>

  <!-- Costo promedio -->
  <circle cx="296" cy="252" r="22" fill="#e6f0f8" stroke="#0e72c5" stroke-width="2"/>
  <text x="296" y="260" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0e72c5" text-anchor="middle">$</text>
